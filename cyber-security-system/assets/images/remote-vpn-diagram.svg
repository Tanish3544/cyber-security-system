<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="100%" height="100%" style="background:#0f172a; border-radius:12px; font-family:'Segoe UI',sans-serif;">
  <defs>
    <linearGradient id="userGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1e40af" />
    </linearGradient>
    <linearGradient id="tunnelGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="gatewayGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="corpGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <marker id="arrowVpn" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10b981" />
    </marker>
    <filter id="shadowVpn">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <text x="450" y="30" fill="#f8fafc" font-size="16" font-weight="bold" text-anchor="middle" letter-spacing="1">
    SECURE REMOTE NETWORK ACCESS VIA ENCRYPTED VPN TUNNEL
  </text>
  <text x="450" y="50" fill="#94a3b8" font-size="12" text-anchor="middle">
    Multi-Factor Authentication (MFA), IPsec/WireGuard Encryption, and Zero-Trust Verification
  </text>

  <!-- Remote User -->
  <g transform="translate(30, 85)" filter="url(#shadowVpn)">
    <rect width="170" height="150" rx="12" fill="url(#userGrad)" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="85" y="42" fill="#ffffff" font-size="28" text-anchor="middle">💻</text>
    <text x="85" y="70" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">Remote Worker</text>
    <text x="85" y="88" fill="#bfdbfe" font-size="10" text-anchor="middle">Home / Public Wi-Fi</text>
    
    <rect x="15" y="102" width="140" height="34" rx="6" fill="#0f172a" fill-opacity="0.6"/>
    <text x="85" y="116" fill="#38bdf8" font-size="9" text-anchor="middle">VPN Client Active</text>
    <text x="85" y="128" fill="#34d399" font-size="9" text-anchor="middle">🔑 MFA Verified (OTP/FIDO)</text>
  </g>

  <!-- Encrypted Tunnel Cylinder -->
  <g transform="translate(240, 105)" filter="url(#shadowVpn)">
    <!-- Public Untrusted Cloud Box -->
    <rect x="-10" y="-15" width="260" height="110" rx="12" fill="#1e293b" fill-opacity="0.5" stroke="#475569" stroke-dasharray="4"/>
    <text x="120" y="5" fill="#94a3b8" font-size="10" text-anchor="middle">UNTRUSTED PUBLIC INTERNET</text>

    <!-- The Secure Tunnel -->
    <rect x="10" y="25" width="220" height="50" rx="25" fill="url(#tunnelGrad)" stroke="#38bdf8" stroke-width="2"/>
    <text x="120" y="48" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">🔒 ENCRYPTED VPN TUNNEL</text>
    <text x="120" y="62" fill="#e0f2fe" font-size="9" text-anchor="middle">AES-256-GCM &bull; IPsec / WireGuard</text>
    
    <!-- Eavesdropper blocked -->
    <text x="120" y="90" fill="#ef4444" font-size="10" text-anchor="middle">❌ Sniffers / MitM Eavesdroppers Blocked</text>
  </g>

  <!-- Line connecting to Gateway -->
  <line x1="490" y1="155" x2="525" y2="155" stroke="#10b981" stroke-width="3" marker-end="url(#arrowVpn)"/>

  <!-- Corporate Gateway -->
  <g transform="translate(535, 85)" filter="url(#shadowVpn)">
    <rect width="140" height="150" rx="12" fill="url(#gatewayGrad)" stroke="#34d399" stroke-width="2"/>
    <text x="70" y="42" fill="#ffffff" font-size="28" text-anchor="middle">🛡️</text>
    <text x="70" y="70" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">Corporate VPN</text>
    <text x="70" y="86" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">Gateway / Firewall</text>
    <text x="70" y="108" fill="#a7f3d0" font-size="9" text-anchor="middle">Decryption &amp; Inspection</text>
    <text x="70" y="122" fill="#6ee7b7" font-size="9" text-anchor="middle">Zero-Trust RBAC</text>
  </g>

  <!-- Line connecting to Internal Net -->
  <line x1="675" y1="155" x2="710" y2="155" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrowVpn)"/>

  <!-- Corporate Intranet -->
  <g transform="translate(720, 85)" filter="url(#shadowVpn)">
    <rect width="150" height="150" rx="12" fill="url(#corpGrad)" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="75" y="36" fill="#38bdf8" font-size="24" text-anchor="middle">🏢</text>
    <text x="75" y="58" fill="#f8fafc" font-size="12" font-weight="bold" text-anchor="middle">Internal Intranet</text>
    
    <rect x="15" y="70" width="120" height="26" rx="4" fill="#0f172a"/>
    <text x="75" y="87" fill="#94a3b8" font-size="9" text-anchor="middle">Database Servers</text>

    <rect x="15" y="102" width="120" height="26" rx="4" fill="#0f172a"/>
    <text x="75" y="119" fill="#94a3b8" font-size="9" text-anchor="middle">ERP &amp; File Shares</text>
  </g>
</svg>
